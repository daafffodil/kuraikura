<!doctype html>

<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="description" content="kuraikura 手写字体与自由排版工具"><title>kuraikura 手写排版</title><style>:root{--ink:#20231f;--muted:#62675d;--line:#dce0d7;--paper:#fff;--accent:#36422d;--surface:#f3f4ef;--focus:#637e49;color-scheme:light;font-family:system-ui,-apple-system,"Microsoft YaHei",sans-serif;color:var(--ink);background:var(--surface)}
*{box-sizing:border-box}body{margin:0}header{height:74px;padding:0 28px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;background:var(--paper);gap:16px}h1{font-size:18px;font-weight:550;letter-spacing:.03em;margin:0}.actions{display:flex;gap:8px}button{font:inherit;font-size:13px;background:var(--paper);color:var(--ink);border:1px solid var(--line);border-radius:7px;min-height:44px;padding:9px 15px;cursor:pointer}button:hover{background:#eef1e9;border-color:#b9c1b0}button:active{transform:translateY(1px)}button:disabled{opacity:.4;cursor:default}button:focus-visible,input:focus-visible,textarea:focus-visible,summary:focus-visible{outline:2px solid var(--focus);outline-offset:3px}.primary{background:var(--accent);color:white;border-color:var(--accent)}.primary:hover{background:#46583b;color:white}main{display:grid;grid-template-columns:300px minmax(0,1fr);min-height:calc(100dvh - 74px)}aside{padding:26px 23px;background:var(--paper);border-right:1px solid var(--line)}label{font-size:13px}.field{display:block;margin-bottom:12px}textarea{width:100%;height:162px;resize:vertical;padding:13px;border:1px solid var(--line);border-radius:8px;background:#fafbf8;font:16px/1.8 system-ui,"Microsoft YaHei",sans-serif;color:var(--ink)}.samples{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px}.samples button{font-size:12px;padding:6px 9px;min-height:36px}.mode{display:grid;grid-template-columns:1fr 1fr;margin:20px 0 26px;background:#f2f3ee;padding:3px;border-radius:8px;gap:4px}.mode button{border:0;background:transparent;padding:8px}.mode button[aria-pressed=true]{background:var(--paper);box-shadow:0 1px 4px #0001}.control{display:flex;align-items:center;justify-content:space-between;margin-top:24px}output{color:var(--muted);font-variant-numeric:tabular-nums;font-size:12px}input[type=range]{width:100%;height:26px;accent-color:var(--accent);margin:8px 0 0}.wide{width:100%;margin-top:25px}details{margin-top:28px;border-top:1px sol <main>

 <label class="control" for="spacing"><span data-i18n="spacing">字距</span><output id="spacingValue">65</output></label><input id="spacing" type="range" min="12" max="220" value="65">
 <label class="control" for="columns"><span data-i18n="columns">每行字数</span><output id="columnsValue">5</output></label><input id="columns" type="range" min="2" max="10" value="5">
 <button id="reshuffle" class="wide primary" data-i18n="shuffle">换个排列</button>
 <details><summary data-i18n="characters">字库文字</summary><div id="characters" class="characters"></div></details>
 <p class="version" data-i18n="version">3000 字，三套笔形</p>
</aside>
<section id="workspace" class="workspace" aria-label="排版预览"><div id="paper" class="paper"></div></section>
