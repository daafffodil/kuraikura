<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="description" content="kuraikura 手写字体与自由排版工具"><title>kuraikura 手写排版</title><style>/*STYLE*/</style></head>
<body>
<header><div class="brand"><h1>kuraikura</h1><a id="about" data-i18n="about">项目说明</a><a id="guide" data-i18n="guide">制作教程</a></div><div class="actions"><select id="language" aria-label="语言"><option value="zh">中文</option><option value="en">English</option><option value="ja">日本語</option></select><button id="fontDownload" data-i18n="download" disabled>下载字体</button><button id="saveSvg" data-i18n="svg" disabled>导出 SVG</button><button id="savePng" class="primary" data-i18n="png" disabled>导出 PNG</button></div></header>
<main>
<aside>
 <label class="field" for="content" data-i18n="content">文字</label><textarea id="content" maxlength="160" spellcheck="false">回收一下
总有惊喜</textarea>
 <div class="samples"><button data-sample="0">回收一下</button><button data-sample="1">今天的天气</button><button data-sample="2">生活可爱</button><button data-sample="3">和朋友吃饭</button><button data-sample="4">春天去河边</button><button data-sample="5">小伙伴</button><button data-sample="6">窗前的茉莉</button><button data-sample="7">蝴蝶</button></div>
 <p id="error" role="status" aria-live="polite">正在载入字库</p>
 <div class="mode" role="group"><button id="natural" aria-pressed="true" data-i18n="natural">自然排列</button><button id="plain" aria-pressed="false" data-i18n="plain">普通排版</button></div>
 <label class="control" for="scatter"><span data-i18n="scatter">错落</span><output id="scatterValue">90</output></label><input id="scatter" type="range" min="0" max="100" value="90">
 <label class="control" for="variation"><span data-i18n="variation">大小变化</span><output id="variationValue">80</output></label><input id="variation" type="range" min="0" max="100" value="80">
 <label class="control" for="spacing"><span data-i18n="spacing">字距</span><output id="spacingValue">65</output></label><input id="spacing" type="range" min="12" max="220" value="65">
 <label class="control" for="columns"><span data-i18n="columns">每行字数</span><output id="columnsValue">5</output></label><input id="columns" type="range" min="2" max="10" value="5">
 <button id="reshuffle" class="wide primary" data-i18n="shuffle">换个排列</button>
 <details><summary data-i18n="characters">字库文字</summary><div id="characters" class="characters"></div></details>
 <p class="version" data-i18n="version">3000 字，三套笔形</p>
</aside>
<section id="workspace" class="workspace" aria-label="排版预览"><div id="paper" class="paper"></div></section>
</main><div id="toast" role="status" aria-live="polite"></div>
<script>const DATA=/*DATA*/;</script><script>/*ENGINE*/</script><script>/*APP*/</script>
</body></html>
